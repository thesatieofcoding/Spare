[workspace]
resolver = "2"
members = ["contracts/*"]

[workspace.dependencies]
# Pinned: 26.x+ declares rust-version 1.91; Homebrew toolchain is 1.90.
soroban-sdk = "=25.3.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
